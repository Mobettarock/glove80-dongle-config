name: Build

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: moergo-sc/zmk
          ref: main
          path: src
      - uses: cachix/install-nix-action@v25
        with:
          nix_path: nixpkgs=channel:nixos-22.05
      - uses: cachix/cachix-action@v14
        with:
          name: moergo-glove80-zmk-dev
          skipPush: true
      - name: Build Glove80 combined firmware
        run: nix-build --arg config './config' -A glove80_lh -o result_lh
      - name: Build nRF52840 MDK Dongle firmware
        run: nix-build --arg config './config' --arg board 'nrf52840_mdk_usb_dongle' -A glove80_dongle -o result_dongle || true
      - name: Prepare firmware artifacts
        run: |
          mkdir -p firmware
          [ -f result_lh/glove80.uf2 ] && cp result_lh/glove80.uf2 firmware/glove80_lh.uf2 || true
          [ -f result_dongle/glove80.uf2 ] && cp result_dongle/glove80.uf2 firmware/glove80_dongle.uf2 || true
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: glove80_firmware
          path: firmware/*

name: Build

on: [push, pull_request, workflow_dispatch]

jobs:
  build-keyboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: moergo-sc/zmk
          ref: main
          path: src
      - uses: cachix/install-nix-action@v25
        with:
          nix_path: nixpkgs=channel:nixos-22.05
      - uses: cachix/cachix-action@v14
        with:
          name: moergo-glove80-zmk-dev
          skipPush: true
      - name: Build Keyboard Firmware
        run: ./build.sh
      - name: Upload Keyboard Artifact
        uses: actions/upload-artifact@v4
        with:
          name: glove80_halves
          path: glove80.uf2

  build-dongle:
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:stable
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Initialize Zephyr workspace
        run: |
          west init -l config
          west update
          west zephyr-export
      - name: Build Dongle UF2
        run: |
          west build -s zmk/app -b nrf52840_mdk_usb_dongle -d build/dongle -- -DZMK_CONFIG="$(pwd)/config"
      - name: Upload Dongle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dongle_firmware
          path: build/dongle/zephyr/zmk.uf2

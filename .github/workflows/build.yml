name: Build

on: [push, pull_request, workflow_dispatch]

jobs:
  build-keyboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: moergo-sc/zmk
          ref: main
          path: src
      - uses: cachix/install-nix-action@v25
        with:
          nix_path: nixpkgs=channel:nixos-22.05
      - uses: cachix/cachix-action@v14
        with:
          name: moergo-glove80-zmk-dev
          skipPush: true
      - name: Build Keyboard Firmware
        run: ./build.sh
      - name: Upload Keyboard Artifact
        uses: actions/upload-artifact@v4
        with:
          name: glove80_halves
          path: glove80.uf2

  build-dongle:
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:stable
    steps:
      - name: Checkout user repo
        uses: actions/checkout@v4
        with:
          path: config-repo
      - name: Checkout MoErgo ZMK
        uses: actions/checkout@v4
        with:
          repository: moergo-sc/zmk
          ref: main
          path: zmk
      - name: Initialize Zephyr
        run: |
          cd zmk
          west init -l app/
          west update
          west zephyr-export
      - name: Prepare Keymap and Overlay
        run: |
          CONFIG_DIR="$GITHUB_WORKSPACE/config-repo/config"
          cp "$CONFIG_DIR/glove80.keymap" "$CONFIG_DIR/nrf52840_mdk_usb_dongle.keymap"
          cat << 'EOF' > "$CONFIG_DIR/nrf52840_mdk_usb_dongle.overlay"
          #include <dt-bindings/zmk/matrix_transform.h>
          / {
              chosen {
                  zmk,kscan = &mock_kscan;
                  zmk,matrix-transform = &default_transform;
              };

              default_transform: keymap_transform_0 {
                  compatible = "zmk,matrix-transform";
                  columns = <10>;
                  rows = <8>;
                  map = <
                      RC(0,0) RC(0,1) RC(0,2) RC(0,3) RC(0,4)                 RC(0,5) RC(0,6) RC(0,7) RC(0,8) RC(0,9)
                      RC(1,0) RC(1,1) RC(1,2) RC(1,3) RC(1,4)                 RC(1,5) RC(1,6) RC(1,7) RC(1,8) RC(1,9)
                      RC(2,0) RC(2,1) RC(2,2) RC(2,3) RC(2,4)                 RC(2,5) RC(2,6) RC(2,7) RC(2,8) RC(2,9)
                      RC(3,0) RC(3,1) RC(3,2) RC(3,3) RC(3,4)                 RC(3,5) RC(3,6) RC(3,7) RC(3,8) RC(3,9)
                      RC(4,0) RC(4,1) RC(4,2) RC(4,3) RC(4,4) RC(5,2) RC(5,7) RC(4,5) RC(4,6) RC(4,7) RC(4,8) RC(4,9)
                      RC(5,0) RC(5,1) RC(5,3) RC(5,4) RC(6,3) RC(6,4) RC(6,5) RC(6,6) RC(5,5) RC(5,6) RC(5,8) RC(5,9)
                      RC(6,0) RC(6,1) RC(6,2)         RC(7,3) RC(7,4) RC(7,5) RC(7,6)         RC(6,7) RC(6,8) RC(6,9)
                  >;
              };

              mock_kscan: kscan_0 {
                  compatible = "zmk,kscan-mock";
                  columns = <0>;
                  rows = <0>;
                  events = <0>;
              };
          };
          EOF
      - name: Build Dongle Primary Firmware
        run: |
          cd zmk/app
          west build -b nrf52840_mdk_usb_dongle -d build/dongle -- \
            -DZMK_CONFIG="$GITHUB_WORKSPACE/config-repo/config" \
            -DCONFIG_ZMK_SPLIT=y \
            -DCONFIG_ZMK_SPLIT_BLE=y \
            -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=y \
            -DCONFIG_ZMK_USB=y \
            -DCONFIG_USB_DEVICE_HID=y \
            -DCONFIG_USB_DEVICE_STACK=y \
            -DCONFIG_BUILD_OUTPUT_UF2=y
          
          if [ -f "build/dongle/zephyr/zmk.uf2" ]; then
            cp build/dongle/zephyr/zmk.uf2 "$GITHUB_WORKSPACE/dongle.uf2"
          elif [ -f "build/dongle/zephyr/zephyr.uf2" ]; then
            cp build/dongle/zephyr/zephyr.uf2 "$GITHUB_WORKSPACE/dongle.uf2"
          else
            UF2CONV="$GITHUB_WORKSPACE/zmk/zephyr/scripts/build/uf2conv.py"
            if [ -f "build/dongle/zephyr/zmk.hex" ]; then
              python3 "$UF2CONV" -c -f 0xADA52840 -o "$GITHUB_WORKSPACE/dongle.uf2" build/dongle/zephyr/zmk.hex
            elif [ -f "build/dongle/zephyr/zephyr.hex" ]; then
              python3 "$UF2CONV" -c -f 0xADA52840 -o "$GITHUB_WORKSPACE/dongle.uf2" build/dongle/zephyr/zephyr.hex
            fi
          fi

      - name: Build Dongle Settings Reset
        run: |
          cd zmk/app
          west build -b nrf52840_mdk_usb_dongle -d build/reset -- \
            -DSHIELD=settings_reset \
            -DCONFIG_BUILD_OUTPUT_UF2=y
          
          if [ -f "build/reset/zephyr/zmk.uf2" ]; then
            cp build/reset/zephyr/zmk.uf2 "$GITHUB_WORKSPACE/dongle_reset.uf2"
          elif [ -f "build/reset/zephyr/zephyr.uf2" ]; then
            cp build/reset/zephyr/zephyr.uf2 "$GITHUB_WORKSPACE/dongle_reset.uf2"
          else
            UF2CONV="$GITHUB_WORKSPACE/zmk/zephyr/scripts/build/uf2conv.py"
            if [ -f "build/reset/zephyr/zmk.hex" ]; then
              python3 "$UF2CONV" -c -f 0xADA52840 -o "$GITHUB_WORKSPACE/dongle_reset.uf2" build/reset/zephyr/zmk.hex
            elif [ -f "build/reset/zephyr/zephyr.hex" ]; then
              python3 "$UF2CONV" -c -f 0xADA52840 -o "$GITHUB_WORKSPACE/dongle_reset.uf2" build/reset/zephyr/zephyr.hex
            fi
          fi

      - name: Upload Dongle Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dongle_firmware
          path: dongle.uf2

      - name: Upload Dongle Reset Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dongle_settings_reset
          path: dongle_reset.uf2
